name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  # The work-bound tests count hash/equality calls; pin the seed so CI is reproducible.
  SWIFT_DETERMINISTIC_HASHING: "1"

jobs:
  macos:
    name: swift build + test (macOS, warnings as errors)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  linux:
    name: swift build + test (Linux, Swift 6.0)
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

  ios:
    name: xcodebuild (iOS Simulator, generic)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme AgentAdmission \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
